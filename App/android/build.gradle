// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // Các mạng quảng cáo mà adapter mediation AppLovin MAX của @alf/app-sdk kéo về (bản thân AppLovin ở Maven Central).
        maven { url 'https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea' }
        maven { url 'https://artifact.bytedance.com/repository/pangle' }
        maven { url 'https://artifactory.bidmachine.io/bidmachine' }
    }
}

// @alf/app-sdk tự khai báo repo maven.applovin.com, nhưng tên miền này không còn phân giải được (NXDOMAIN) và một repo
// lỗi mạng làm Gradle dừng cả lượt tải thay vì thử repo khác. AppLovin đã chuyển lên Maven Central nên bỏ repo đó đi.
subprojects {
    afterEvaluate { p ->
        p.repositories.removeAll { it instanceof MavenArtifactRepository && it.url?.host == 'maven.applovin.com' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
